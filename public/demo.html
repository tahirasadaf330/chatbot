<!doctype html>
<meta charset="utf-8" />
<title>PDF RAG Chat</title>
<h1>PDF RAG Chat</h1>
<p>Upload a PDF, wait for “Indexed…”, then ask.</p>

<input id="pdf" type="file" accept="application/pdf">
<button onclick="upload()">Upload</button>
<small id="status">No document uploaded.</small>

<div id="chat" style="margin-top:10px;border:1px solid #ccc;height:250px;overflow:auto;padding:8px;"></div>
<div style="margin-top:8px">
  <input id="q" placeholder="Ask a question…" style="width:70%">
  <button onclick="ask()">Ask</button>
</div>

<script>
let docId=null; const API=location.origin;
function add(t){ const d=document.createElement('div'); d.textContent=t; chat.appendChild(d); chat.scrollTop=1e9; }
async function upload(){
  const f=pdf.files[0]; if(!f){ alert('Choose a PDF'); return; }
  const fd=new FormData(); fd.append('file', f);
  status.textContent='Uploading…';
  const r=await fetch(API+'/upload',{method:'POST',body:fd});
  const j=await r.json();
  if(!r.ok){ add('Upload failed: '+(j.detail||JSON.stringify(j))); status.textContent='Upload failed'; return; }
  docId=j.doc_id; status.textContent=`Indexed. doc_id=${docId} (chunks=${j.chunks})`; add('Document indexed. Ask away!');
}
async function ask(){
  const qq=q.value.trim(); if(!qq) return;
  if(!docId){ alert('Upload a PDF first'); return; }
  add('You: '+qq); q.value='';
  const r=await fetch(API+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({doc_id:docId,question:qq})});
  const j=await r.json(); add('Bot: '+(j.answer||'No answer'));
}
</script>
